plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cep.buscador'
    compileSdk 34

    defaultConfig {
        applicationId "com.cep.buscador"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        // Assinatura release via variaveis de ambiente (nunca commitar senhas).
        // Sem ANDROID_KEYSTORE definido, o bloco fica vazio e NAO e usado.
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE")
            if (ksPath) {
                storeFile file(ksPath)
                storeType "PKCS12"
                storePassword System.getenv("ANDROID_KEYSTORE_PASS")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "appkey"
                keyPassword System.getenv("ANDROID_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // So assina quando o keystore foi informado; sem isso mantem o
            // comportamento atual (APK release nao assinado).
            if (System.getenv("ANDROID_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
