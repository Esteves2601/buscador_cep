<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem conexão — Buscador de CEP</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --verde: #236B32; --bege: #FAF6ED; --texto: #1E1C12; --muted: #655E4B; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bege);
      color: var(--texto);
      font-family: 'Plus Jakarta Sans', system-ui, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 2.2rem; margin: 0 0 8px; color: var(--verde); font-weight: 800; }
    p { margin: 6px 0 20px; color: var(--muted); }
    a {
      display: inline-block;
      background: var(--verde);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>Você está offline. Reconecte-se para consultar o ViaCEP.</p>
    <a href="/">Tentar novamente</a>
  </main>
</body>
</html>
